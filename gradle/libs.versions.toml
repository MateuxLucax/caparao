[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

activityCompose = "1.13.0"
androidxCore = "1.19.1"
composeBom = "2026.09.00"
composeMaterial3 = "1.5.0-beta01"
wearCompose = "1.7.1"
lifecycle = "2.11.0"
room = "2.8.5"
work = "2.12.0"
playServicesWearable = "20.0.1"
coroutines = "1.11.0"
wearRemoteInteractions = "1.2.0"
fragment = "1.9.1"
wearOngoing = "1.1.0"

androidxTestRunner = "1.7.0"
espresso = "3.7.0"
junit = "4.13.2"
json = "20250517"
robolectric = "4.17"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
core = { module = "androidx.core:core", version.ref = "androidxCore" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
wear-remote-interactions = { module = "androidx.wear:wear-remote-interactions", version.ref = "wearRemoteInteractions" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit4 = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
