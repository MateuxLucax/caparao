<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Flex;src:url(../../app/src/main/res/font/roboto_flex.ttf)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#F6F7F4;font-family:Flex}
#bg{position:absolute;inset:0;background:#1E3B2C;clip-path:circle(0% at 50% 50%)}
.t{position:absolute;left:0;right:0;text-align:center;color:#16211B;opacity:0;will-change:transform}
.h{font-size:64px;letter-spacing:-1.5px}.s{font-size:28px;color:#5A6B60;font-variation-settings:"wght" 420}
.p{position:absolute;width:230px;height:499px;border-radius:34px;overflow:hidden;opacity:0;
 box-shadow:0 30px 60px rgba(20,40,30,.18),0 0 0 7px #101512}
.p img{width:100%;height:100%;display:block}
.w{position:absolute;width:300px;height:300px;border-radius:50%;overflow:hidden;opacity:0;box-shadow:0 30px 60px rgba(20,40,30,.2),0 0 0 12px #101512}
.w img{width:100%}
</style></head><body><div id="bg"></div><div id="root"></div><script>
const S='../../docs/screenshots/en/',W='../../docs/screenshots/watch/en/';
const root=document.getElementById('root');
function el(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;root.appendChild(d);return d}
const ph=f=>el('p',`<img src="${S}${f}-light.png">`);
// scenes: [start,end]
const sc=[];
function text(a,b,top,h,cls,delay=0,light){const d=el('t '+cls,h);d.style.top=top+'px';if(light)d.style.color=light;sc.push({d,a:a+delay,b,k:'txt'});return d}
function phone(a,b,f,x,y,delay=0){const d=ph(f);d.style.left=x+'px';d.style.top=y+'px';sc.push({d,a:a+delay,b,k:'ph'});return d}
// 1 intro 0-3
text(0,3,250,'Caparaó','h',0.2).style.fontSize='120px';
text(0,3,410,'Your Timemore Dot, your way.','s',0.9);
// 2 home 3-6.5
text(3,6.5,250,'Live weight<br>and flow.','h',0.1).style.cssText+='text-align:left;left:150px;right:auto';
phone(3,6.5,'home',830,140,0.2);
// 3 dose 6.5-10
text(6.5,10,250,'Weigh the beans.<br>The water follows.','h',0.1).style.cssText+='text-align:left;left:150px;right:auto';
phone(6.5,10,'brew-weigh',740,140,0.2);phone(6.5,10,'brew-dose',990,180,0.4);
// 4 guide 10-14
text(10,14,250,'Guided,<br>pour by pour.','h',0.1).style.cssText+='text-align:left;left:150px;right:auto';
phone(10,14,'guide-countdown',740,180,0.2);phone(10,14,'guide-pour',990,140,0.4);
// 5 data 14-18.5
text(14,18.5,40,'Every brew becomes data.','h',0.1);
phone(14,18.5,'brew-detail',290,190,0.3);phone(14,18.5,'compare',525,170,0.45);phone(14,18.5,'trends',760,190,0.6);
// 6 watch 18.5-21.5
text(18.5,21.5,280,'On your wrist, too.','h',0.1).style.cssText+='text-align:left;left:150px;right:auto';
const w=el('w',`<img src="${W}pour.png">`);w.style.left='820px';w.style.top='210px';sc.push({d:w,a:18.7,b:21.5,k:'ph'});
// 7 outro 21.5-25
text(21.6,26,250,'Caparaó','h',0.4,'#fff').style.fontSize='120px';
text(21.6,26,410,'Coffee, measured.','s',0.9,'#CFE3D6');
text(21.6,26,600,'Open source  ·  Android and Wear OS','s',1.4,'#9FBFAB').style.fontSize='22px';
const ease=x=>1-Math.pow(1-x,4), back=x=>{const c=1.5;x--;return 1+(c+1)*x*x*x+c*x*x};
const cl=x=>Math.max(0,Math.min(1,x));
window.render=t=>{
 for(const s of sc){const i=cl((t-s.a)/0.7),o=cl((t-(s.b-0.45))/0.45);
  let op=Math.min(ease(i),1-ease(o));
  if(s.k==='txt'){const y=40*(1-ease(i))-30*ease(o);const wg=300+500*ease(cl((t-s.a)/1.2));
   s.d.style.opacity=op;s.d.style.transform=`translateY(${y}px)`;
   if(s.d.classList.contains('h'))s.d.style.fontVariationSettings=`"wght" ${wg}, "wdth" ${100+ (s.d.style.color?0:0)}`}
  else{const y=160*(1-back(i))-60*ease(o);const r=0.92+0.08*ease(i);
   s.d.style.opacity=op;s.d.style.transform=`translateY(${y}px) scale(${r})`}}
 document.getElementById('bg').style.clipPath=`circle(${150*ease(cl((t-21.3)/0.8))}% at 50% 50%)`;
};
render(0);
</script></body></html>
