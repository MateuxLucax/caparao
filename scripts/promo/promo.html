<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Flex;src:url(../../app/src/main/res/font/roboto_flex.ttf)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#F3F5F1;font-family:Flex}
#bg{position:absolute;inset:0;background:#1E3B2C;clip-path:circle(0% at 50% 50%)}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;left:610px;top:-20px;
 background:radial-gradient(circle,rgba(46,107,74,.20),rgba(46,107,74,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;color:#13201A;opacity:0}
.l{text-align:left;left:130px;right:auto}
.h{font-size:66px;line-height:1.04;letter-spacing:-2px}.h em{font-style:normal;color:#2E6B4A}
.s{font-size:26px;color:#5A6B60;font-variation-settings:"wght" 420}
.p{position:absolute;width:268px;height:595px;border-radius:44px;opacity:0;padding:9px;box-sizing:border-box;
 background:linear-gradient(145deg,#3a3f3c,#0d100e 40%,#1b1f1c 70%,#4a504c);
 box-shadow:0 40px 80px -20px rgba(16,40,28,.35),0 18px 30px -12px rgba(16,40,28,.25),inset 0 0 0 1.5px rgba(255,255,255,.18)}
.p:before{content:"";position:absolute;right:-3px;top:130px;width:3px;height:56px;border-radius:2px;background:#2a2e2b}
.p:after{content:"";position:absolute;right:-3px;top:210px;width:3px;height:34px;border-radius:2px;background:#2a2e2b}
.scr{width:100%;height:100%;border-radius:36px;overflow:hidden;background:#F4F7F2}
.scr img{width:100%;height:100%;display:block;object-fit:cover}
.w{position:absolute;width:300px;height:300px;border-radius:50%;opacity:0;padding:14px;box-sizing:border-box;
 background:linear-gradient(145deg,#4a504c,#0d100e 45%,#2a2e2b);box-shadow:0 40px 80px -20px rgba(16,40,28,.4)}
.w img{width:100%;border-radius:50%;display:block}
</style></head><body><div class="glow" id="glow"></div><div id="bg"></div><div id="root"></div><script>
const W='../../docs/screenshots/watch/en/';
const root=document.getElementById('root'),sc=[],clips=[];
function el(cls,html){const d=document.createElement('div');d.className=cls;d.innerHTML=html;root.appendChild(d);return d}
function text(a,b,top,h,cls,delay=0,color){const d=el('t '+cls,h);d.style.top=top+'px';if(color)d.style.color=color;sc.push({d,a:a+delay,b,k:'txt'});return d}
function phone(a,b,clip,x,y,{delay=0.15,start=0,speed=1}={}){const d=el('p','<div class="scr"><img></div>');d.style.left=x+'px';d.style.top=y+'px';
 sc.push({d,a:a+delay,b,k:'ph'});clips.push({img:d.querySelector('img'),clip,a,b,start,speed});return d}
const N={'home-live':240,dose:243,'guide-pour':240,'espresso-live':243,data:233,recipes:240};
let T=0;function scene(dur,f){f(T,T+dur);T+=dur}
scene(3,(a,b)=>{text(a,b,240,'Caparaó','h',0.2).style.fontSize='128px';text(a,b,410,'Your Timemore Dot, your way.','s',0.9)});
scene(5,(a,b)=>{text(a,b,250,'Live weight<br><em>and flow.</em>','h l',0.1);phone(a,b,'home-live',850,62,{start:40})});
scene(5,(a,b)=>{text(a,b,250,'Weigh the beans.<br><em>The water follows.</em>','h l',0.1);phone(a,b,'dose',850,62,{start:60})});
scene(5,(a,b)=>{text(a,b,250,'Guided,<br><em>pour by pour.</em>','h l',0.1);phone(a,b,'guide-pour',850,62,{start:80})});
scene(5,(a,b)=>{text(a,b,250,'Every shot,<br><em>recorded live.</em>','h l',0.1);phone(a,b,'espresso-live',850,62,{start:90})});
scene(5.5,(a,b)=>{text(a,b,250,'Every brew<br><em>becomes data.</em>','h l',0.1);phone(a,b,'data',850,62,{start:60})});
scene(5,(a,b)=>{text(a,b,250,'Recipes,<br><em>your way.</em>','h l',0.1);phone(a,b,'recipes',850,62,{start:80})});
scene(3.5,(a,b)=>{text(a,b,270,'On your wrist,<br><em>too.</em>','h l',0.1);
 const w=el('w',`<img src="${W}pour.png">`);w.style.left='830px';w.style.top='210px';sc.push({d:w,a:a+0.2,b,k:'ph'})});
const O=T;scene(4.5,(a,b)=>{text(a,b+1,240,'Caparaó','h',0.4,'#fff').style.fontSize='128px';
 text(a,b+1,410,'Coffee, measured.','s',0.9,'#CFE3D6');text(a,b+1,600,'Open source  ·  Android and Wear OS','s',1.4,'#9FBFAB').style.fontSize='20px'});
window.DURATION=T;
const ease=x=>1-Math.pow(1-x,4),eio=x=>x<.5?8*x**4:1-Math.pow(-2*x+2,4)/2,back=x=>{const c=1.4;x--;return 1+(c+1)*x*x*x+c*x*x};
const cl=x=>Math.max(0,Math.min(1,x));
window.render=async t=>{const loads=[];
 for(const s of sc){const i=cl((t-s.a)/0.8),o=cl((t-(s.b-0.5))/0.5);const op=Math.min(ease(i),1-ease(o));
  if(s.k==='txt'){const y=36*(1-ease(i))-24*ease(o);s.d.style.opacity=op;s.d.style.filter=`blur(${8*(1-ease(i))+6*ease(o)}px)`;
   s.d.style.transform=`translateY(${y}px)`;if(s.d.classList.contains('h'))s.d.style.fontVariationSettings=`"wght" ${250+550*ease(cl((t-s.a)/1.3))}`}
  else{const y=220*(1-back(i))-80*eio(o);const r=0.94+0.06*ease(i)+0.02*cl((t-s.a)/5);s.d.style.opacity=Math.min(1,op*1.5);
   s.d.style.transform=`translateY(${y}px) scale(${r}) rotate(${-3*(1-ease(i))}deg)`}}
 for(const c of clips){if(t<c.a-0.1||t>c.b+0.1)continue;const f=Math.min(N[c.clip],Math.max(1,Math.round(c.start+(t-c.a)*30*c.speed)));
  const src=`frames/${c.clip}/${String(f).padStart(4,'0')}.jpg`;if(!c.img.src.endsWith(src)){c.img.src=src;loads.push(c.img.decode().catch(()=>{}))}}
 document.getElementById('bg').style.clipPath=`circle(${150*eio(cl((t-O+0.2)/1.0))}% at 50% 50%)`;
 document.getElementById('glow').style.opacity=1-cl((t-O)/0.5);await Promise.all(loads)};
</script></body></html>
