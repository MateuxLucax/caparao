# Read by the nightly SonarQube scan on the homeserver, which fetches the "coverage" artifact of the Build workflow
# for the scanned commit. Paths are relative to the repository root.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/coverage/test/debug/report.xml
sonar.go.coverage.reportPaths=stub/coverage.out

# Tests are tests, not uncovered code: without this SonarQube counted them in coverage and as duplication (the JVM
# screen tests follow the instrumented ones). The probe never ships (docs/spike.md). The homeserver's scan adds its own
# build-output exclusions as sonar.global.exclusions.
sonar.sources=.
sonar.exclusions=probe/**,app/src/test/**,app/src/androidTest/**,**/*_test.go
sonar.tests=.
sonar.test.inclusions=app/src/test/**,app/src/androidTest/**,**/*_test.go

# Rules that do not apply where they fire, each with its reason (rule and path, so the rule still holds elsewhere).
sonar.issue.ignore.multicriteria=testIps,scriptRandom,appCleartext
# Test data: the LAN-detection tests need literal private and public addresses.
sonar.issue.ignore.multicriteria.testIps.ruleKey=kotlin:S1313
sonar.issue.ignore.multicriteria.testIps.resourceKey=app/src/test/**
# Seeded noise for synthetic sessions and screenshots, not a security use.
sonar.issue.ignore.multicriteria.scriptRandom.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.scriptRandom.resourceKey=scripts/**
# By design: the server is on the LAN over HTTP, and Settings warns on a public host (no network security config can
# allow "any private address").
sonar.issue.ignore.multicriteria.appCleartext.ruleKey=xml:S5332
sonar.issue.ignore.multicriteria.appCleartext.resourceKey=app/src/main/AndroidManifest.xml

# Room's generated code (KSP) is not ours to test; scripts/ is developer tooling (release, screenshots, synthetic data).
sonar.coverage.exclusions=**/*_Impl.kt,scripts/**
