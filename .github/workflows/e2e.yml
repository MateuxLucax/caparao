name: End-to-end

# Reusable emulator gate for Build and release validation.
on:
  workflow_call:
    inputs:
      force_failure:
        required: false
        default: false
        type: boolean

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: false

      # Cache the system image installed by android-emulator-runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-36/google_apis/x86_64
          key: android-emulator-${{ runner.os }}-api-36-google-apis-x86_64-v1

      - name: Enable KVM
        run: |
          log_dir="$RUNNER_TEMP/caparao-e2e-raw-logs"
          mkdir -p "$log_dir"
          log="$log_dir/emulator.log"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules | tee -a "$log"
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=5
          {
            echo "KVM preflight after udev trigger and settle"
            echo "Runner kernel: $(uname -r)"
            id
            getent group kvm || echo "No kvm group is present."
            if [ -e /sys/class/misc/kvm/dev ]; then
              printf 'KVM sysfs device: '
              cat /sys/class/misc/kvm/dev
            else
              echo "KVM is not registered under /sys/class/misc."
            fi
            if [ -e /dev/kvm ]; then
              stat -Lc 'KVM node: type=%F mode=%a owner=%U:%G uid=%u gid=%g' /dev/kvm
              sudo udevadm info --query=all --name=/dev/kvm || true
            else
              echo "/dev/kvm does not exist."
            fi
            if [ -r /dev/kvm ]; then echo "/dev/kvm is readable."; else echo "/dev/kvm is not readable."; fi
            if [ -w /dev/kvm ]; then echo "/dev/kvm is writable."; else echo "/dev/kvm is not writable."; fi
          } | tee -a "$log"
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "/dev/kvm is not accessible; refusing software-emulated E2E under issue #80's runtime limit." \
              | tee -a "$log" >&2
            exit 1
          fi

      - name: Prepare E2E logs
        run: |
          raw_log_dir="$RUNNER_TEMP/caparao-e2e-raw-logs"
          rm -f "$RUNNER_TEMP/caparao-e2e-artifacts-ready"
          mkdir -p "$raw_log_dir"
          python3 scripts/ci/e2e-diagnostics.py prepare-output \
            --log-dir "$RUNNER_TEMP/caparao-e2e-logs" \
            --raw-dir "$raw_log_dir" \
            --managed-output-root "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/caparao-e2e-artifacts-ready"
          printf 'Emulator startup diagnostics; see the emulator-runner step in the Actions log.\n' \
            >> "$raw_log_dir/emulator.log"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_FORCE_FAILURE: ${{ inputs.force_failure || false }}
        with:
          # API 36 is above minSdk 31; compileSdk 37 has no published emulator image on the hosted runner yet.
          api-level: 36
          target: google_apis
          arch: x86_64
          # Leave the runner's 320x640 dp default in place to keep the small-screen weigh flow covered (#145).
          channel: stable
          emulator-boot-timeout: 300
          disable-linux-hw-accel: false
          # The action runs its script through sh -c; invoke the pipefail wrapper explicitly with Bash.
          script: bash scripts/ci/e2e-ci.sh

      - name: Capture emulator diagnostics
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 scripts/ci/e2e-diagnostics.py collect \
            --log-dir "$RUNNER_TEMP/caparao-e2e-logs" \
            --adb "$ANDROID_HOME/platform-tools/adb" \
            --heading "Post-run emulator diagnostics" \
            --append-emulator \
            --existing-safe-logs

      - name: Check artifact readiness
        id: artifact_gate
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/caparao-e2e-artifacts-ready" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload end-to-end failure logs
        if: failure() && steps.artifact_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/caparao-e2e-logs/
          if-no-files-found: warn
          retention-days: 7
