name: End-to-end

# Run on main and on demand. This separate workflow keeps emulator time outside the Build → Release path (#80).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail after E2E passes to verify failure log uploads"
        required: false
        default: false
        type: boolean

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: stub/go.mod

      # Cache the system image installed by android-emulator-runner.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /usr/local/lib/android/sdk/system-images/android-37/google_apis/x86_64
          key: android-emulator-${{ runner.os }}-api-37-google-apis-x86_64-v1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules

      - name: Prepare E2E logs
        run: mkdir -p "$RUNNER_TEMP/caparao-e2e-logs"

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          E2E_FORCE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_failure == 'true' }}
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            logs="$RUNNER_TEMP/caparao-e2e-logs"
            E2E_LOG_DIR="$logs" E2E_PORT=8099 scripts/e2e.sh 2>&1 | tee "$logs/e2e.log"
            if [ "$E2E_FORCE_FAILURE" = "true" ]; then
              echo "Intentional failure after E2E passed, to verify failure log upload." >&2
              exit 1
            fi

      - name: Upload end-to-end failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/caparao-e2e-logs/
          if-no-files-found: warn
          retention-days: 7
