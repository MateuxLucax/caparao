name: Release

# Publish only after the protected main-to-release PR is merged and its final tree matches the tested candidate.
on:
  pull_request:
    branches: [release]
    types: [closed]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-tree:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Find the successful release validation run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          runs=$(gh api "repos/$GH_REPO/actions/workflows/release-validation.yml/runs?event=pull_request&per_page=100")
          run_id=$(python3 scripts/ci/select-release-validation-run.py "$PR_NUMBER" "$PR_HEAD_SHA" <<< "$runs")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the tested tree
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "${{ steps.candidate.outputs.run_id }}" --name "release-tree-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}" --dir "$RUNNER_TEMP/candidate"

      - name: Require the merged tree to match the tested tree
        run: |
          tested_tree=$(cat "$RUNNER_TEMP/candidate/candidate-tree.txt")
          merged_tree=$(git rev-parse 'HEAD^{tree}')
          # GitHub creates a new merge commit SHA; publication must use the exact tree that passed Build and E2E.
          [ "$tested_tree" = "$merged_tree" ] || {
            echo "::error::merged tree $merged_tree differs from validated tree $tested_tree"
            exit 1
          }
          echo "Validated tree: $merged_tree" >> "$GITHUB_STEP_SUMMARY"

  sign:
    needs: verify-tree
    if: needs.verify-tree.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.name }}
      signer: ${{ steps.signer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compute version
        id: version
        run: |
          name="$(tr -d '[:space:]' < VERSION).$GITHUB_RUN_NUMBER"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Only this job receives the existing release key; it cannot write to the repository.
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Releases must be signed with the release key. Set the repository secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD (README, Release signing)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          # Opt-in remote diagnostics (#333). The DSN only reaches BuildConfig; the token only uploads R8 mappings.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          ./gradlew --console=plain assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER" -PsentryDsn="$SENTRY_DSN"
          cp app/build/outputs/apk/release/app-release.apk "caparao-$VERSION_NAME.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "caparao-wear-$VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Signer certificate
        id: signer
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          sha256=$("$apksigner" verify --print-certs "caparao-$VERSION_NAME.apk" | grep -i -m 1 'certificate SHA-256 digest:' | sed 's/.*[Dd]igest: *//')
          [ -n "$sha256" ] || { echo "::error::could not read the APK signer"; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Signer certificate SHA-256: \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caparao-${{ env.VERSION_NAME }}
          path: |
            caparao-${{ env.VERSION_NAME }}.apk
            caparao-wear-${{ env.VERSION_NAME }}.apk

  publish:
    needs: sign
    if: needs.sign.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.sign.outputs.version }}
      APK: caparao-${{ needs.sign.outputs.version }}.apk
      WEAR_APK: caparao-wear-${{ needs.sign.outputs.version }}.apk
      TARGET_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      SIGNER_NOTE: "APK signer certificate SHA-256: `${{ needs.sign.outputs.signer }}`"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: caparao-${{ needs.sign.outputs.version }}

      - name: Publish GitHub Release
        run: scripts/ci/publish-release.sh
