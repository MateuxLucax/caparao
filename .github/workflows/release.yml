name: Release

# A signed APK on GitHub Releases, automatic on every green push to main (after the Build workflow passes). It can
# also be run from the Actions tab or by pushing a v* tag (docs/adr/0012-sideloaded-apk-releases.md).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [Build]
    branches: [main]
    types: [completed]

# Actions are pinned to commit SHAs (tag in the comment). The signing secrets are only in the build job, which can't
# write to the repository; the release job can write and never sees them.
permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.name }}
      signer: ${{ steps.signer.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$(tr -d '[:space:]' < VERSION).$GITHUB_RUN_NUMBER"
          fi
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Every release must be signed with the same release key, or updates won't install over the previous version.
      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::Releases must be signed with the release key. Set the repository secrets SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS and SIGNING_KEY_PASSWORD (README, Release signing)."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew --console=plain testDebugUnitTest

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --console=plain assembleRelease -PversionName="$VERSION_NAME" -PversionCode="$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/release/app-release.apk "caparao-$VERSION_NAME.apk"
          # The watch companion, same key (docs/adr/0023-watch-companion.md).
          cp wear/build/outputs/apk/release/wear-release.apk "caparao-wear-$VERSION_NAME.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      # Lets users check the APK's signer before installing (apksigner from the runner's Android SDK).
      - name: Signer certificate
        id: signer
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          sha256=$("$apksigner" verify --print-certs "caparao-$VERSION_NAME.apk" | grep -i -m 1 'certificate SHA-256 digest:' | sed 's/.*[Dd]igest: *//')
          [ -n "$sha256" ] || { echo "::error::could not read the APK signer"; exit 1; }
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "Signer certificate SHA-256: \`$sha256\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: caparao-${{ env.VERSION_NAME }}
          path: |
            caparao-${{ env.VERSION_NAME }}.apk
            caparao-wear-${{ env.VERSION_NAME }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ needs.build.outputs.version }}
      APK: caparao-${{ needs.build.outputs.version }}.apk
      WEAR_APK: caparao-wear-${{ needs.build.outputs.version }}.apk
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SIGNER_NOTE: "APK signer certificate SHA-256: `${{ needs.build.outputs.signer }}`"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: caparao-${{ needs.build.outputs.version }}

      # The release may already exist (drafted in the GitHub UI for a tag, or an earlier attempt of this run).
      - name: Publish GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$WEAR_APK" --clobber
            notes=$(gh release view "$TAG" --json body --jq .body)
            if [[ "$notes" != *"$SIGNER_NOTE"* ]]; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$notes" "$SIGNER_NOTE")"
            fi
          else
            # GitHub puts --notes before the generated notes.
            gh release create "$TAG" "$APK" "$WEAR_APK" --target "$TARGET_SHA" --title "$TAG" --generate-notes --notes "$SIGNER_NOTE"
          fi
