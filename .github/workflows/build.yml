name: Build

on:
  pull_request:
    branches: [main]
    paths-ignore: ["assets/**", "**/*.md", "LICENSE"]
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail after E2E passes to verify failure log uploads"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      force_failure:
        required: false
        default: false
        type: boolean

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Shared local and CI checks
        run: scripts/check.sh

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports
          retention-days: 7

  e2e:
    needs: fast
    uses: ./.github/workflows/e2e.yml
    with:
      force_failure: ${{ inputs.force_failure || false }}
