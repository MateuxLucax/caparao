name: Build

# One lean job while the repository is private (GitHub Free minutes): unit tests, lint, the debug build and the
# stub's contract tests, the same as scripts/check.sh. Instrumented and end-to-end tests run on a local emulator (docs/adr/0015-acceptance-and-lean-ci.md).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (tag in the comment).
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          # Robolectric's SDK 37 sandbox (the JVM screen tests) needs Java 21; the app still targets Java 17.
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests, lint and build
        run: ./gradlew --console=plain createDebugUnitTestCoverageReport :wear:testDebugUnitTest :wearlink:test lintDebug assembleDebug compileDebugAndroidTestKotlin

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: stub/go.mod

      - name: Stub tests against contract/
        working-directory: stub
        run: go vet ./... && go test -coverprofile=coverage.out ./...

      # Picked up by the nightly SonarQube scan on the homeserver (sonar-project.properties).
      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            app/build/reports/coverage/test/debug/report.xml
            stub/coverage.out
          retention-days: 7

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports
          retention-days: 7
