name: Screenshots

# docs/screenshots rendered on the JVM (scripts/screenshots.sh), for a branch, as an artifact: for sessions without the
# Android SDK. Run from the Actions tab or `gh workflow run screenshots.yml --ref <branch>`.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-72q2ic] # TEMP: until this PR is ready

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: scripts/screenshots.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: |
            docs/screenshots
            app/build/reports/tests
          retention-days: 7
