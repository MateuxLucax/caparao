name: Screenshots

# docs/screenshots rendered on the JVM (scripts/screenshots.sh) and committed to the branch it runs on, for sessions
# without the Android SDK. Run from the Actions tab or `gh workflow run screenshots.yml --ref <branch>`; never on main.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - run: scripts/screenshots.sh

      - name: Commit the images
        run: |
          git status --short docs/screenshots
          git diff --quiet docs/screenshots && git diff --cached --quiet docs/screenshots && [ -z "$(git ls-files -o docs/screenshots)" ] && { echo "no image changed"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git commit -m "Refresh docs/screenshots"
          git push

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests
          retention-days: 7
