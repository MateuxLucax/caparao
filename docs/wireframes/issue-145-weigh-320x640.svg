<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" aria-labelledby="title desc" role="img" viewBox="0 0 1200 1000"><title id="title">Weigh step · 320 × 640 dp</title><desc id="desc">A compact espresso weigh screen with an adaptive dose ring, a standard Tare control, and a full-width 56 dp Next button above the bottom inset.</desc><defs><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#26332d" flood-opacity=".12" stdDeviation="12"/></filter></defs><rect width="1200" height="1000" fill="#edf2ee"/><text x="72" y="66" fill="#26332d" font-family="Arial,sans-serif" font-size="30" font-weight="700">Weigh step · 320 × 640 dp</text><text x="72" y="102" fill="#65746b" font-family="Arial,sans-serif" font-size="18">Short viewport · planned dose remains visible before the live brew</text><rect width="404" height="768" x="258" y="116" fill="#fff" stroke="#52645a" stroke-width="3" filter="url(#shadow)" rx="38"/><rect width="360" height="720" x="280" y="138" fill="#f6faf6" stroke="#bac9be" rx="24"/><text x="299" y="162" fill="#26332d" font-family="Arial,sans-serif" font-size="12">9:41</text><text x="572" y="162" fill="#26332d" font-family="Arial,sans-serif" font-size="12">● ▰</text><text x="300" y="197" fill="#26332d" font-family="Arial,sans-serif" font-size="23">‹ Espresso</text><text x="300" y="224" fill="#65746b" font-family="Arial,sans-serif" font-size="15">Espresso Oster</text><g rx="3"><rect width="36" height="6" x="300" y="240" fill="#28684e" rx="3"/><rect width="36" height="6" x="344" y="240" fill="#28684e" rx="3"/><rect width="36" height="6" x="388" y="240" fill="#e5eee7" rx="3"/><rect width="36" height="6" x="432" y="240" fill="#e5eee7" rx="3"/><rect width="36" height="6" x="476" y="240" fill="#e5eee7" rx="3"/><rect width="36" height="6" x="520" y="240" fill="#e5eee7" rx="3"/><rect width="36" height="6" x="564" y="240" fill="#e5eee7" rx="3"/></g><text x="300" y="273" fill="#65746b" font-family="Arial,sans-serif" font-size="16">Step 2 of 7 · Weigh the beans</text><circle cx="460" cy="427" r="100" fill="none" stroke="#d9e4dc" stroke-width="14"/><text x="460" y="421" fill="#26332d" font-family="Arial,sans-serif" font-size="40" font-weight="700" text-anchor="middle">0.0 g</text><text x="460" y="454" fill="#65746b" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">of 18.0 g</text><text x="460" y="584" fill="#26332d" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">Weigh the beans</text><text x="460" y="615" fill="#65746b" font-family="Arial,sans-serif" font-size="16" text-anchor="middle">Tare the container, then add the beans.</text><rect width="128" height="56" x="396" y="648" fill="#cfe9d8" rx="28"/><text x="460" y="683" fill="#234638" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">↓ Tare</text><rect width="320" height="56" x="300" y="760" fill="#28684e" rx="28"/><text x="460" y="795" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle">Next</text><rect width="68" height="4" x="426" y="840" fill="#85928a" rx="2"/><path stroke="#52645a" stroke-width="2" d="M662 788H700"/><path fill="none" stroke="#52645a" stroke-width="2" d="M692 781l8 7-8 7"/><rect width="350" height="182" x="706" y="508" fill="#e6f0e9" stroke="#9ab6a2" rx="24"/><g fill="#26332d" font-family="Arial,sans-serif" font-size="18"><text x="730" y="548">The dose ring adapts to the</text><text x="730" y="574">available height.</text><text x="730" y="605">Tare remains full-size.</text><text x="730" y="636">Next stays 56 dp tall,</text><text x="730" y="662">clear of the bottom inset.</text></g><text x="706" y="734" fill="#65746b" font-family="Arial,sans-serif" font-size="16">Material 3 tonal colors · existing copy</text></svg>